<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="board-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded slate background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Mortarboard (flat top square, viewed at angle = diamond) -->
  <polygon points="16,6.5 28,12 16,17.5 4,12" fill="url(#board-grad)"/>

  <!-- Cap base (the part that fits on the head) -->
  <path d="M9.5 14.5 L9.5 19 C9.5 21.4 13 22.8 16 22.8 C19 22.8 22.5 21.4 22.5 19 L22.5 14.5 L16 18 Z"
        fill="url(#cap-grad)"/>

  <!-- Tassel knot (attached to the right corner of the board) -->
  <circle cx="25" cy="12" r="1.2" fill="#fbbf24"/>

  <!-- Tassel cord hanging down -->
  <line x1="25" y1="13" x2="25" y2="18.5" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Tassel fringe -->
  <line x1="24.2" y1="18.3" x2="23.8" y2="21" stroke="#fbbf24" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="25"   y1="18.5" x2="25"   y2="21.4" stroke="#fbbf24" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="25.8" y1="18.3" x2="26.2" y2="21" stroke="#fbbf24" stroke-width="0.9" stroke-linecap="round"/>
</svg>
